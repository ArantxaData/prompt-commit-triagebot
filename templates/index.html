<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TriageBot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  {# htmx descarta por defecto las respuestas 4xx; los 422 del formulario sí se pintan. #}
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[23]..","swap":true},{"code":"409","swap":true},{"code":"422","swap":true},{"code":"[45]..","swap":false,"error":true},{"code":"...","swap":true}]}'>
  <style>
    /* Destello verde breve en la fila recién guardada */
    tr.htmx-added { background-color: #dcfce7; }
    tr { transition: background-color 0.8s ease; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900">
  <main class="mx-auto max-w-6xl p-6">
    <h1 class="text-3xl font-bold">TriageBot</h1>
    <p class="mt-2 text-slate-600">Tablero de incidencias con clasificación automática por IA.</p>

    {% include "_new_ticket_form.html" %}

    <form id="filters" class="mt-6 flex flex-wrap items-end gap-4"
          action="/" method="get"
          hx-get="/" hx-target="#tickets" hx-trigger="change" hx-push-url="true">
      <div>
        <label for="f-status" class="block text-xs font-semibold uppercase text-slate-500">Estado</label>
        <select id="f-status" name="status" class="mt-1 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm">
          {% for value, label in STATUSES %}
          <option value="{{ value }}" {{ "selected" if filters.status == value }}>{{ label }}</option>
          {% endfor %}
          <option value="all" {{ "selected" if filters.status == "all" }}>Todos</option>
        </select>
      </div>
      <div>
        <label for="f-priority" class="block text-xs font-semibold uppercase text-slate-500">Prioridad</label>
        <select id="f-priority" name="priority" class="mt-1 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm">
          <option value="">Todas</option>
          {% for value, label in PRIORITIES %}
          <option value="{{ value }}" {{ "selected" if filters.priority == value }}>{{ label }}</option>
          {% endfor %}
          <option value="{{ NOT_INFERRED }}" {{ "selected" if filters.priority == NOT_INFERRED }}>no inferido</option>
        </select>
      </div>
      <div>
        <label for="f-category" class="block text-xs font-semibold uppercase text-slate-500">Categoría</label>
        <select id="f-category" name="category" class="mt-1 rounded-md border border-slate-300 bg-white px-2 py-1.5 text-sm">
          <option value="">Todas</option>
          {% for value, label in CATEGORIES %}
          <option value="{{ value }}" {{ "selected" if filters.category == value }}>{{ label }}</option>
          {% endfor %}
          <option value="{{ NOT_INFERRED }}" {{ "selected" if filters.category == NOT_INFERRED }}>no inferido</option>
        </select>
      </div>
      <div>
        <label for="f-resp-filter" class="block text-xs font-semibold uppercase text-slate-500">Responsable</label>
        <input id="f-resp-filter" name="responsable" type="search" value="{{ filters.responsable }}"
               placeholder="Nombre exacto" autocomplete="off"
               hx-get="/" hx-trigger="keyup changed delay:400ms" hx-include="#filters"
               hx-target="#tickets" hx-push-url="true"
               class="mt-1 rounded-md border border-slate-300 px-2 py-1.5 text-sm">
      </div>
      <a href="/" class="pb-2 text-sm text-sky-700 underline">Limpiar filtros</a>
    </form>

    <section id="tickets" class="mt-4"
             hx-get="/" hx-trigger="ticket-created from:body" hx-include="#filters">
      {% include "_tickets_table.html" %}
    </section>
  </main>
</body>
</html>
